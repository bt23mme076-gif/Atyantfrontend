<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/logo.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />

  <!-- ── Primary SEO (homepage default; per-view overrides via SEOHead) ── -->
  <title>Atyant - India's First Human + AI Career Execution Platform</title>
  <meta name="description"
    content="India's first Human + AI career execution platform. Placement and internship guidance from seniors of your college and branch who already did it." />
  <link rel="canonical" href="https://atyant.in/" />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <meta name="geo.region" content="IN" />
  <meta name="geo.placename" content="India" />
  <meta name="theme-color" content="#ffffff" />

  <!-- ── Open Graph ── -->
  <meta property="og:title" content="Atyant - India's First Human + AI Career Execution Platform" />
  <meta property="og:description"
    content="India's first Human + AI career execution platform: guidance from seniors who came from a college like yours, same branch, same resources, and still cracked it." />
  <meta property="og:image" content="https://atyant.in/og-default.jpg" />
  <meta property="og:url" content="https://atyant.in/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Atyant" />
  <meta property="og:locale" content="en_IN" />

  <!-- ── Twitter ── -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Atyant - India's First Human + AI Career Execution Platform" />
  <meta name="twitter:description"
    content="India's first Human + AI career execution platform. Someone exactly like you already did it. Here's their path." />
  <meta name="twitter:image" content="https://atyant.in/og-default.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Serif+Devanagari:wght@600;700&display=swap"
    rel="stylesheet" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />

  <!-- ── JSON-LD: Organization + WebApplication ── -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Atyant",
      "alternateName": "अत्यंत",
      "url": "https://atyant.in",
      "logo": "https://atyant.in/logo.jpg",
      "description": "India's first Human + AI career execution platform for engineering students: placement, internship and career guidance from seniors who came from the same college, branch and resources, with AI tools to act on it.",
      "slogan": "Someone exactly like you already did it. Here's their path.",
      "areaServed": "IN",
      "knowsLanguage": ["en", "hi"]
    }
    </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Atyant",
      "url": "https://atyant.in",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web browser",
      "browserRequirements": "Requires JavaScript. Works on any modern browser.",
      "description": "Students ask their placement, internship, higher-studies or career-switch question and AI matches them with seniors who had the same college, branch and resources: career clarity from real journeys, AI mock interviews to prepare, and optional paid 1:1 sessions.",
      "inLanguage": "en-IN",
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "INR",
        "lowPrice": "0",
        "highPrice": "599",
        "offerCount": "500"
      },
      "publisher": { "@type": "Organization", "name": "Atyant", "url": "https://atyant.in" }
    }
    </script>
  <!-- ── JSON-LD: WebSite (site name shown in search results) ── -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Atyant",
      "alternateName": "अत्यंत",
      "url": "https://atyant.in/"
    }
    </script>
  <!-- ── JSON-LD: Homepage FAQ (targets People Also Ask). data-home-only: the
       prerender script strips it from every other route's HTML. ── -->
  <script type="application/ld+json" data-home-only>
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Atyant?",
          "acceptedAnswer": { "@type": "Answer", "text": "Atyant is India's first Human + AI career execution platform for engineering students. You ask your exact question about placements, internships, higher studies or a career switch. AI matches you with a senior who came from the same kind of college, branch and resources as you and still cracked that goal, so you get what actually worked for them, plus tools like AI mock interviews to act on it." }
        },
        {
          "@type": "Question",
          "name": "How is Atyant different from other career guidance?",
          "acceptedAnswer": { "@type": "Answer", "text": "Most career advice comes from people who never faced your situation, so it stays generic. Atyant matches you with a senior from the same background: your college or one like it, your branch, the same limited resources. Their guidance is what actually worked for someone in your position." }
        },
        {
          "@type": "Question",
          "name": "How is Atyant different from a mentor marketplace?",
          "acceptedAnswer": { "@type": "Answer", "text": "Mentor marketplaces list mentors by company and job title. Atyant organises everything around background match: AI finds seniors who faced the same problem with the same college, branch and resources, and you read what actually worked for them before you ever book a session." }
        },
        {
          "@type": "Question",
          "name": "How much does a 1:1 session cost on Atyant?",
          "acceptedAnswer": { "@type": "Answer", "text": "Reading seniors' answers is free. Optional 1:1 sessions with a matched senior are priced between Rs 49 and Rs 599." }
        },
        {
          "@type": "Question",
          "name": "Which colleges and branches does Atyant cover?",
          "acceptedAnswer": { "@type": "Answer", "text": "Any engineering college across India: IITs, NITs, IIITs, BITS, private and state colleges and more. Seniors come from CSE, ECE, Mechanical, Metallurgy, Civil and more, and moved into software, data, product and core roles." }
        }
      ]
    }
    </script>
</head>

  <div id="root"></div>

</body>

</html>
